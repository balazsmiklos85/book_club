<!DOCTYPE html>
<html>
<head><title>{{ t(key="matrix", lang=lang) }}</title></head>
<body>
    {% include "menu.html" %}
    <table>
    {% for user in users %}
    <tr>
        <td>{{ user.name }}</td>
        {% for book in books %}
        <td>
            {% if book.id in user_votes[user.id|str] %}
                ✓
            {% endif %}
        </td>
        {% endfor %}
    </tr>
    {% endfor %}
    </table>
</body>
</html>
