plugins {
	alias(libs.plugins.spring.dependency.management)
	alias(libs.plugins.jacoco)
	alias(libs.plugins.jacoco.report.aggregation)
	alias(libs.plugins.java)
	alias(libs.plugins.liquibase.gradle)
	alias(libs.plugins.spotless)
	alias(libs.plugins.spring.boot)
}

group = 'hu.bmiklos'
version = '1.7.0.0'

java {
	sourceCompatibility = '21'
	targetCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':adapter-jpa')
	implementation project(':adapter-web-thymeleaf')
	implementation project(':business')
	implementation project(':core')
	implementation libs.commons.collections4
	implementation libs.spring.boot.starter.data.jpa
	implementation libs.spring.boot.starter.security
	implementation libs.spring.boot.starter.thymeleaf
	implementation libs.spring.boot.starter.web
	implementation libs.liquibase.core
	implementation libs.thymeleaf.extras.springsecurity6
	runtimeOnly libs.h2.runtime
	runtimeOnly libs.postgresql.runtime
	testImplementation libs.spring.boot.starter.test
	testImplementation libs.spring.security.test
	testImplementation libs.h2.runtime
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntime
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = false
	}
}

testCodeCoverageReport {
	dependsOn jacocoTestReport
}

spotless {
    java {
        target("**/*.java")
        googleJavaFormat()
    }
}

subprojects {
	sourceCompatibility = '21'
	targetCompatibility = '21'
	
	repositories {
		mavenCentral()
	}
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

test {
	useJUnitPlatform()
	finalizedBy testCodeCoverageReport
}

task devRun {
	bootRun.configure {
		systemProperty "spring.profiles.active", 'dev'
		environment 'PORT', 8080
	}
	finalizedBy 'bootRun'
}

task integrationTest(type: Test) {
	description = "Run integration tests"
	group = "verification"
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	environment 'PORT', 8080

	useJUnitPlatform()

	testLogging {
		events "passed"
	}
}

task stage {
	finalizedBy 'build'
}

