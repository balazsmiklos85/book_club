plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

RSpec/MultipleExpectations:
  Exclude:
    - 'spec/features/**/*.rb'

RSpec/ExampleLength:
  Exclude:
    - 'spec/features/**/*.rb'
